<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Room Designer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand">Room<span>Designer</span></div>
        <div class="topbar-group">
          <button id="undo" class="icon-btn" title="Deshacer (Ctrl+Z)">↩</button>
          <button id="redo" class="icon-btn" title="Rehacer (Ctrl+Y)">↪</button>
        </div>
        <div class="topbar-group time-group">
          <span class="sun-icon">☀️</span>
          <input type="range" id="time-slider" min="0" max="24" step="0.25" value="12" title="Hora del día" />
          <span id="time-value">12:00</span>
        </div>
        <div class="topbar-group right">
          <button id="plan-toggle" class="ghost-btn">Plano</button>
          <button id="save" class="ghost-btn">Guardar</button>
          <button id="load" class="ghost-btn">Cargar</button>
          <button id="cart-button" class="ghost-btn">🛒 <span id="cart-summary">0 · 0 €</span></button>
          <button id="new-room" class="primary-btn">Nueva habitación</button>
        </div>
      </header>

      <main id="stage">
        <aside id="catalog">
          <nav id="catalog-tabs">
            <button data-tab="furniture" class="active">Muebles</button>
            <button data-tab="openings">Puertas y ventanas</button>
            <button data-tab="lights">Luces</button>
          </nav>
          <div id="catalog-cards"></div>
        </aside>

        <div id="container3d"></div>

        <div id="plan-overlay" hidden>
          <div id="plan-tools">
            <button data-plantool="select" class="active">Seleccionar</button>
            <button data-plantool="wall">Dibujar pared</button>
            <button id="plan-close">Cerrar plano</button>
          </div>
          <canvas id="canvas2d"></canvas>
        </div>

        <div id="inspector" hidden></div>
        <div id="cart-panel" hidden></div>
        <div id="hint"></div>
      </main>

      <div id="modal-backdrop">
        <div id="create-modal">
          <section id="wizard-step-1">
            <h2>Crea tu habitación</h2>
            <p class="modal-sub">Paso 1 de 2 · Elige la forma y las medidas.</p>
            <div id="shape-cards">
              <button class="shape-card active" data-shape="rect">
                <svg viewBox="0 0 64 48"><rect x="8" y="8" width="48" height="32" rx="2" fill="none" stroke="currentColor" stroke-width="3"/></svg>
                Rectangular
              </button>
              <button class="shape-card" data-shape="l">
                <svg viewBox="0 0 64 48"><path d="M8 8 h48 v18 h-22 v14 H8 Z" fill="none" stroke="currentColor" stroke-width="3"/></svg>
                En L
              </button>
            </div>
            <div class="dim-grid">
              <label>Ancho <input id="dim-w" type="number" min="2" max="15" step="0.1" value="4.5" /> m</label>
              <label>Fondo <input id="dim-d" type="number" min="2" max="15" step="0.1" value="3.5" /> m</label>
              <label>Alto <input id="dim-h" type="number" min="2.2" max="4" step="0.05" value="2.5" /> m</label>
              <label class="l-only" hidden>Recorte ancho <input id="dim-cw" type="number" min="0.5" max="10" step="0.1" value="1.8" /> m</label>
              <label class="l-only" hidden>Recorte fondo <input id="dim-cd" type="number" min="0.5" max="10" step="0.1" value="1.4" /> m</label>
            </div>
            <button id="wizard-next" class="primary-btn big">Continuar</button>
            <button id="modal-load" class="link-btn">o cargar el proyecto guardado</button>
          </section>

          <section id="wizard-step-2" hidden>
            <h2>Puertas y ventanas</h2>
            <p class="modal-sub">Paso 2 de 2 · Haz clic sobre una pared del plano para colocar. Clic sobre una apertura para quitarla.</p>
            <div id="opening-toggle">
              <button data-opening="door" class="active">🚪 Puerta</button>
              <button data-opening="window">🪟 Ventana</button>
            </div>
            <div id="wizard-plan"></div>
            <div class="wizard-actions">
              <button id="wizard-back" class="ghost-btn">Atrás</button>
              <button id="create-room" class="primary-btn">Crear habitación</button>
            </div>
          </section>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
