name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Python (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -c requirements.lock -e '.[dev]'
      - name: Lint (ruff)
        run: .venv/bin/ruff check backend
      - name: Tests (unitarios + aceptación Gherkin + arquitectura + proveedores ADK)
        run: .venv/bin/python -m pytest -q

  calidad:
    name: Front · typecheck · tests · cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # La suite de vitest incluye la integración TS↔Python (levanta el
      # backend real con proveedores fake), así que necesita el .venv.
      - name: Instalar backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -c requirements.lock -e .
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (unitarios + aceptación Gherkin + propiedades + integración)
        run: npx vitest run --coverage
      - name: Puerta de cobertura de specs
        # Cada escenario Gherkin debe tener test de aceptación (TS o Python).
        run: npx vitest run tests/acceptance/spec-coverage.test.ts

  build:
    name: Build de producción
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  mutacion:
    name: Mutation testing (rompe < 75%)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Stryker relanza vitest, que incluye la integración TS↔Python.
      - name: Instalar backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -c requirements.lock -e .
      - run: npm ci
      - name: Stryker
        run: npx stryker run

  infra:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.6
      - name: Formato
        run: tofu -chdir=infra/gcp fmt -check -diff
      - name: Validación
        run: |
          tofu -chdir=infra/gcp init -backend=false -input=false
          tofu -chdir=infra/gcp validate
