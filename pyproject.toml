[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "room-designer"
version = "2.0.0"
description = "Room design tools and catalog services powered by Google ADK"
requires-python = ">=3.12"
dependencies = [
  "google-adk==2.9.0",
  "google-auth>=2,<3",
  "requests>=2,<3",
  "litellm==1.100.1",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1",
  "numpy>=2,<3",
  "pillow>=11,<13",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]
clip = ["transformers>=4.50,<5", "torch>=2.6,<3"]
mesh = ["gradio-client>=1.10,<3"]

[project.scripts]
designer-serve = "room_designer.bootstrap:designer_main"
search-serve = "room_designer.bootstrap:search_main"
catalog = "room_designer.pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
markers = ["scenario(name): maps a Gherkin scenario to an executable acceptance test"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
